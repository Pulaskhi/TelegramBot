<section style="padding:24px; max-width:520px; margin:24px auto;">
  <h2>Crear contraseña</h2>
  <p>Introduce tu nombre y una contraseña para finalizar el registro.</p>
  <form id="create-form" method="post" action="#">
    <div style="margin:8px 0"><label>Nombre<br><input id="name" name="name" type="text" required></label></div>
    <div style="margin:8px 0"><label>Contraseña<br><input id="password" name="password" type="password" required autocomplete="new-password"></label></div>
    <div style="margin:8px 0"><label>Confirmar contraseña<br><input id="password2" name="password2" type="password" required></label></div>
    <div style="margin:8px 0"><button type="button" id="create-btn">Crear cuenta</button></div>
  </form>
  <p id="message"></p>
</section>

<script src="./create-password.js"></script>
